name: minhas_financas

services:
  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: app_minhas_financas
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../www:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: web_minhas_financas
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ../www:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: db_minhas_financas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minhas_financas
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_minhas_financas
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  queue:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: queue_minhas_financas
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ../www:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge
